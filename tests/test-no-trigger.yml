name: Test command not triggered when comment does not match
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload with non-matching comment
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/payload.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 99,
              "pull_request": {
                "url": "https://api.github.com/repos/test-owner/test-repo/pulls/99"
              }
            },
            "comment": {
              "id": 99999,
              "body": "This is just a regular comment, not a command",
              "user": {
                "login": "monalisa"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "monalisa"
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_EVENT_PATH: /tmp/event/payload.json
          GITHUB_EVENT_NAME: issue_comment
        with:
          github_token: ${{ github.token }}
          command: ".deploy"
          reaction: "eyes"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"
        continue-on-error: true

      - name: Assert triggered is false when comment does not match command
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: $TRIGGERED"
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered=false but got true"
            exit 1
          fi
          echo "PASS: triggered is '$TRIGGERED' (not 'true') as expected for non-matching comment"
