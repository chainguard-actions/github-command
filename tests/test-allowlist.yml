name: Test allowlist configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ".deploy"
          reaction: "eyes"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "monalisa,octocat"
          skip_completing: "true"

      - name: Assert action failed gracefully outside issue_comment context with allowlist set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome='failure' when run outside issue_comment context, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in issue_comment context (allowlist scenario)"
