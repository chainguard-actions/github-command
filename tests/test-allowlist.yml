name: Test command action - allowlist configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ".deploy"
          reaction: "eyes"
          allowed_contexts: "pull_request,issue"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          allowlist: "monalisa,octocat"
          skip_completing: "true"

      - name: Assert triggered is not true
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: '$TRIGGERED'"
          # Under workflow_dispatch the action errors before setting triggered,
          # so triggered will be empty or "false" — either is acceptable here.
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to not be 'true', got: $TRIGGERED"
            exit 1
          fi
          echo "PASS: triggered is not true (value: '$TRIGGERED')"

      - name: Assert continue is not true
        env:
          CONTINUE: ${{ steps.action.outputs.continue }}
        run: |
          echo "continue: '$CONTINUE'"
          if [ "$CONTINUE" = "true" ]; then
            echo "FAIL: expected continue to not be 'true', got: $CONTINUE"
            exit 1
          fi
          echo "PASS: continue is not true (value: '$CONTINUE')"
