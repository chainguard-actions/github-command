name: Test draft and fork options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          command: ".test"
          reaction: "eyes"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "true"
          allow_forks: "true"
          skip_ci: "true"
          skip_reviews: "true"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"
          fork_review_bypass: "false"

      - name: Assert action failed gracefully outside issue_comment context with draft and fork options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: '$OUTCOME'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome='failure' when run outside issue_comment context, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when not in issue_comment context (draft/fork options scenario)"
