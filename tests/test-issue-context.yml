name: Test issue context - not allowed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          command: ".lint"
          reaction: "rocket"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"
        continue-on-error: true

      - name: Assert triggered is not true
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: $TRIGGERED"
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty"
            exit 1
          fi
          echo "PASS: triggered is '$TRIGGERED'"
