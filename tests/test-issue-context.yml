name: Test command in issue context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload for a plain issue (no PR)
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/payload.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 7
            },
            "comment": {
              "id": 77777,
              "body": ".lint",
              "user": {
                "login": "octocat"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "octocat"
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_EVENT_PATH: /tmp/event/payload.json
          GITHUB_EVENT_NAME: issue_comment
        with:
          github_token: ${{ github.token }}
          command: ".lint"
          reaction: "eyes"
          allowed_contexts: "issue"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"
        continue-on-error: true

      - name: Assert action ran and produced outputs
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "triggered: $TRIGGERED"
          # In issue context, the action should at least set triggered output
          # It may fail due to API access but should not crash unexpectedly
          echo "PASS: action completed with outcome '$OUTCOME'"
