name: Test command with parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake issue_comment event payload with command and params
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/payload.json <<'EOF'
          {
            "action": "created",
            "issue": {
              "number": 55,
              "pull_request": {
                "url": "https://api.github.com/repos/test-owner/test-repo/pulls/55"
              }
            },
            "comment": {
              "id": 55555,
              "body": ".deploy | production | us-east-1",
              "user": {
                "login": "monalisa"
              }
            },
            "repository": {
              "full_name": "test-owner/test-repo",
              "name": "test-repo",
              "owner": {
                "login": "test-owner"
              }
            },
            "sender": {
              "login": "monalisa"
            }
          }
          EOF

      - id: action
        uses: .
        env:
          GITHUB_EVENT_PATH: /tmp/event/payload.json
          GITHUB_EVENT_NAME: issue_comment
        with:
          github_token: ${{ github.token }}
          command: ".deploy"
          reaction: "rocket"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"
        continue-on-error: true

      - name: Assert action ran
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          PARAMS: ${{ steps.action.outputs.params }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "triggered: $TRIGGERED"
          echo "params: $PARAMS"
          # The action should complete without an unhandled crash
          echo "PASS: action completed with outcome '$OUTCOME'"

      - name: Assert triggered is not true when API is unavailable
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: $TRIGGERED"
          # In act without real GitHub API, triggered should not be 'true'
          # since the action cannot verify permissions via API
          if [ "$TRIGGERED" = "true" ]; then
            echo "NOTE: triggered=true (action had API access)"
          else
            echo "PASS: triggered='$TRIGGERED' (expected without real API access)"
          fi
