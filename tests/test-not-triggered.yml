name: Test command not triggered
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          command: ".deploy"
          reaction: "eyes"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: "|"
          allowlist: "false"
          skip_completing: "true"

      - name: Assert triggered output is false or action handled gracefully
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "triggered: $TRIGGERED"
          echo "outcome: $OUTCOME"
          # The action should either output triggered=false or fail gracefully
          # since there's no real GitHub API context (no issue_number, no comment)
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty, got true"
            exit 1
          fi
          echo "PASS: action did not trigger unexpectedly"
