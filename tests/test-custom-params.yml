name: Test custom parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issue_comment
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          command: ".deploy"
          reaction: "eyes"
          success_reaction: "+1"
          failure_reaction: "-1"
          allowed_contexts: "pull_request,issue"
          permissions: "write,admin"
          allow_drafts: "true"
          allow_forks: "false"
          skip_ci: "true"
          skip_reviews: "true"
          param_separator: ":"
          allowlist: "false"
          skip_completing: "true"
          fork_review_bypass: "false"
        continue-on-error: true

      - name: Assert action completed and triggered is not true
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: $TRIGGERED"
          # Without a real GitHub API context and matching comment, triggered should not be 'true'
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty in test environment"
            exit 1
          fi
          echo "PASS: triggered is '$TRIGGERED'"

      - name: Assert continue is not true
        env:
          CONTINUE: ${{ steps.action.outputs.continue }}
        run: |
          echo "continue: $CONTINUE"
          if [ "$CONTINUE" = "true" ]; then
            echo "FAIL: expected continue to be empty or false in test environment"
            exit 1
          fi
          echo "PASS: continue is '$CONTINUE'"
