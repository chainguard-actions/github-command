name: Test custom param separator and allowlist
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: ".test"
          reaction: "eyes"
          success_reaction: "+1"
          failure_reaction: "-1"
          allowed_contexts: "pull_request"
          permissions: "write,admin"
          allow_drafts: "false"
          allow_forks: "false"
          skip_ci: "false"
          skip_reviews: "false"
          param_separator: ":"
          allowlist: "false"
          skip_completing: "true"
        continue-on-error: true

      - name: Assert triggered is false or empty
        env:
          TRIGGERED: ${{ steps.action.outputs.triggered }}
        run: |
          echo "triggered: $TRIGGERED"
          if [ "$TRIGGERED" = "true" ]; then
            echo "FAIL: expected triggered to be false or empty under workflow_dispatch"
            exit 1
          fi
          echo "PASS: triggered is not true (as expected with no PR comment context)"

      - name: Assert continue is empty or false
        env:
          CONTINUE: ${{ steps.action.outputs.continue }}
        run: |
          echo "continue: $CONTINUE"
          if [ "$CONTINUE" = "true" ]; then
            echo "FAIL: expected continue to be empty or false"
            exit 1
          fi
          echo "PASS: continue is not true (as expected)"
